<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watermelon Phenotyping</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  
  <!-- Add Chart.js for Histograms -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px;}
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    th { background-color: #f4f4f4; }
    img.thumb { max-width: 150px; border-radius: 5px; cursor: pointer; }
    .status { margin-top: 10px; font-weight: bold; color: #333; }
    .charts-container { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 30px; }
    .chart-box { width: 400px; height: 300px; }
  </style>
</head>
<body>
  <main class="container">
    <h1>Watermelon Phenotyping</h1>
    <p class="subtitle">Upload images</p>

    <section class="card">
      <h2>Single Image</h2>
      <form id="single-form">
        <input type="file" id="single-file" accept=".jpg,.jpeg,.png" required>
        <button type="submit">Process Single</button>
      </form>
      <div id="single-status" class="status"></div>
      <div id="single-result" class="result-grid"></div>
    </section>

    <section class="card">
      <h2>Bulk Images</h2>
      <form id="bulk-form">
        <input type="file" id="bulk-files" multiple accept=".jpg,.jpeg,.png" required>
        <button type="submit">Process Batch</button>
      </form>
      <div id="bulk-status" class="status"></div>
      
      <table id="bulk-table" style="display: none;">
        <thead>
          <tr>
            <th>Filename</th>
            <th>R²</th>
            <th>Width (mm)</th>
            <th>Height (mm)</th>
            <th>Perim (mm)</th>
            <th>ΔE (Init)</th>
            <th>ΔE (Final)</th>
            <th>Preview</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      
      <!-- Container for dynamic histograms -->
      <div id="histograms-container" class="charts-container"></div>
      
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
